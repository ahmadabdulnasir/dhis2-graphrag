[project]
name = "dhis2-graphrag"
version = "0.1.0"
description = "GraphRAG framework for natural-language querying of DHIS2 public health data (MIT thesis, Miva Open University)"
authors = [{ name = "Ahmad Abdulnasir Shuaib", email = "a.shuaib0054@miva.edu.ng" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "networkx>=3.1",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "matplotlib>=3.8",
    "neo4j>=5.15",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# sentence-transformers pulls PyTorch (~3GB); install only when needed
embeddings = ["sentence-transformers>=2.5", "faiss-cpu>=1.7.4"]
llm = ["openai>=1.20"]
# ragas 0.4.x is incompatible with langchain-community 0.4 (removed vertexai
# module breaks ragas at import time); pin the known-good combination
ragas = [
    "ragas>=0.2,<0.3",
    "langchain-community>=0.3,<0.4",
    "langchain<1",
    "langchain-core<0.4",
    "langchain-openai<0.3",
    "datasets>=2.18",
]
dev = ["pytest>=8.0", "httpx>=0.27", "jupyter>=1.0"]

# Run as an application (scripts import `src.*` from the project root),
# not an installed package — avoids editable-install permission issues on
# some filesystems.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
